<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Exergy - Concept 2: The "EX" Thermodynamic Flux Cross -->
  <rect width="512" height="512" fill="#0E1012" />
  <rect x="0.5" y="0.5" width="511" height="511" stroke="#25292E" stroke-width="1" />
  
  <!-- Technical Blueprint Grid & Ticks -->
  <path d="M24 36 V24 H36 M476 24 H488 V36 M24 476 V488 H36 M488 476 V488 H476" stroke="#25292E" stroke-width="1.5" />
  
  <!-- Header Monospace Telemetry -->
  <text x="64" y="64" fill="#5A6068" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.14em">NODE: [EX // FLUX_INTERSECTION]</text>
  <text x="448" y="64" text-anchor="end" fill="#5A6068" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.1em">±P_INFLECTION</text>

  <!-- ==================== THE "EX" GLYPH ==================== -->
  
  <!-- LEFT: The "E" Manifold (Battery Power Bus) -->
  <!-- Main Vertical Power Spine -->
  <rect x="64" y="104" width="48" height="304" fill="#F0F2F5" />
  
  <!-- Top Discharge Arm (Traction +P) -->
  <rect x="112" y="104" width="108" height="60" fill="#D0D4D8" />
  
  <!-- Middle Arm (Climate Sinks) -->
  <rect x="112" y="226" width="96" height="48" fill="#4E79A7" />
  <rect x="112" y="278" width="64" height="24" fill="#E19C24" />
  
  <!-- Bottom Arm (Regen Collector -P) -->
  <rect x="112" y="348" width="108" height="60" fill="#59A14F" />

  <!-- RIGHT: The "X" Flux Cross (Interlocking Mitred Diagonals) -->
  <!-- Positive Acceleration Vector: Bottom-Left to Top-Right (Silver/White) -->
  <!-- Enters at (232, 408), crosses to (448, 104) with width 52px -->
  <polygon points="232,408 284,408 448,162 448,104 396,104 232,350" fill="#F0F2F5" />
  
  <!-- Negative Regeneration Vector: Top-Left to Bottom-Right (Green) -->
  <!-- Enters at (232, 104), crosses to (448, 408) with width 52px, separated at cross -->
  <!-- Upper leg of regen cross -->
  <polygon points="232,104 284,104 332,176 296,203" fill="#59A14F" />
  <!-- Center gap / 1px isolation barrier -->
  <line x1="288" y1="210" x2="392" y2="302" stroke="#0E1012" stroke-width="8" />
  <!-- Lower leg of regen cross -->
  <polygon points="348,256 396,318 448,408 396,408 296,256" fill="#59A14F" />

  <!-- Auxiliary Telemetry Calibration Ticks -->
  <line x1="64" y1="448" x2="448" y2="448" stroke="#25292E" stroke-width="1" />
  <line x1="64" y1="444" x2="64" y2="452" stroke="#5A6068" stroke-width="1.5" />
  <line x1="256" y1="444" x2="256" y2="452" stroke="#5A6068" stroke-width="1.5" />
  <line x1="448" y1="444" x2="448" y2="452" stroke="#5A6068" stroke-width="1.5" />
  <text x="64" y="472" fill="#8C929A" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700">−150 kW [REGEN]</text>
  <text x="256" y="472" text-anchor="middle" fill="#5A6068" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700">0 kW [COAST]</text>
  <text x="448" y="472" text-anchor="end" fill="#D0D4D8" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700">+350 kW [DRIVE]</text>
</svg>
