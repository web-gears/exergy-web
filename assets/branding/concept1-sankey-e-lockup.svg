<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <!-- Exergy - Concept 1: Full Horizontal Brand Lockup -->
  
  <!-- Icon Mark Container (0px radius, 1px hairline border) -->
  <rect x="12" y="12" width="76" height="76" fill="#16191D" stroke="#25292E" stroke-width="1" />
  
  <!-- Mini Sankey "E" Glyph inside the 76x76 box -->
  <!-- Battery Spine -->
  <rect x="24" y="24" width="10" height="16" fill="#F0F2F5" />
  <rect x="24" y="42" width="10" height="14" fill="#F0F2F5" />
  <rect x="24" y="58" width="10" height="18" fill="#F0F2F5" />
  
  <!-- Traction Top Arm -->
  <rect x="34" y="24" width="40" height="12" fill="#D0D4D8" />
  <!-- Kinetic Drop & Mitre -->
  <polygon points="64,36 74,36 74,46 64,56" fill="#D0D4D8" />
  <polygon points="64,56 74,46 74,64 64,64" fill="#59A14F" />
  
  <!-- Middle Arm (Climate & Elevation) -->
  <rect x="34" y="43" width="24" height="7" fill="#4E79A7" />
  <rect x="34" y="51" width="16" height="4" fill="#E19C24" />
  
  <!-- Regen Bottom Arm Loop -->
  <path d="M74 64 V76 H38 L34 70 L38 64 H64 Z" fill="#59A14F" />

  <!-- Typography Hierarchy -->
  <!-- Brand Name: EXERGY -->
  <text x="110" y="58" fill="#F0F2F5" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="0.06em">EXERGY</text>
  
  <!-- Hairline Vertical Divider -->
  <line x1="312" y1="28" x2="312" y2="72" stroke="#25292E" stroke-width="1" />

  <!-- Sub-label & Telemetry Descriptor -->
  <text x="330" y="46" fill="#8C929A" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.12em">E<tspan font-size="10" dy="2">X</tspan><tspan dy="-2"> // THERMODYNAMIC FLOW</tspan></text>
  <text x="330" y="66" fill="#5A6068" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em">AAOS &amp; COMPANION TELEMETRY</text>
</svg>
