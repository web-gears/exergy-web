<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Exergy - Concept 3: The Grassmann Conservation Reticle -->
  <rect width="512" height="512" fill="#0E1012" />
  
  <!-- Outer 1px Structural Frame -->
  <rect x="0.5" y="0.5" width="511" height="511" stroke="#25292E" stroke-width="1" />
  
  <!-- Precision HUD Reticle Frame -->
  <rect x="40" y="40" width="432" height="432" stroke="#25292E" stroke-width="1" />
  
  <!-- Corner Alignment Crosshairs -->
  <path d="M40 60 V40 H60 M452 40 H472 V60 M40 452 V472 H60 M472 452 V472 H452" stroke="#F0F2F5" stroke-width="2" />
  
  <!-- Center Crosshair Hairlines -->
  <line x1="256" y1="40" x2="256" y2="72" stroke="#5A6068" stroke-width="1" />
  <line x1="256" y1="440" x2="256" y2="472" stroke="#5A6068" stroke-width="1" />
  <line x1="40" y1="256" x2="72" y2="256" stroke="#5A6068" stroke-width="1" />
  <line x1="440" y1="256" x2="472" y2="256" stroke="#5A6068" stroke-width="1" />

  <!-- Four Boundary Labels in Technical Monospace -->
  <text x="56" y="60" fill="#8C929A" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700">T_0: 20°C</text>
  <text x="456" y="60" text-anchor="end" fill="#8C929A" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700">P_0: 101.3 kPa</text>
  <text x="56" y="460" fill="#59A14F" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700">η_II: 91.8%</text>
  <text x="456" y="460" text-anchor="end" fill="#E19C24" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700">ΔS_IRR ≈ 0</text>

  <!-- ==================== THE CONSERVATION CIRCUIT ==================== -->
  
  <!-- Top Circuit Arm: Forward Useful Work (High-Voltage Discharge) -->
  <path d="M112 144 H400 V200 H168 V312 H112 Z" fill="#F0F2F5" />
  <rect x="232" y="144" width="168" height="56" fill="#D0D4D8" />
  
  <!-- Thermal Split Notch (Climate HVAC) -->
  <rect x="344" y="200" width="56" height="56" fill="#4E79A7" />
  
  <!-- Gravitational Potential Interlock (Elevation) -->
  <rect x="112" y="312" width="56" height="56" fill="#E19C24" />

  <!-- Bottom Circuit Arm: Closed Regenerative Recovery Loop -->
  <path d="M400 368 H112 V312 H344 V200 H400 Z" fill="#59A14F" />

  <!-- Center Hero Notation: Ex -->
  <rect x="196" y="216" width="120" height="80" fill="#16191D" stroke="#25292E" stroke-width="1" />
  <text x="256" y="268" text-anchor="middle" fill="#F0F2F5" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">E<tspan font-size="28" font-family="'Roboto Mono', monospace" fill="#8C929A" dy="8">x</tspan></text>
</svg>
