<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Exergy Official Favicon: Concept 1 Grassmann Sankey "E" -->
  <rect width="64" height="64" fill="#0E1012" />
  <rect x="0.5" y="0.5" width="63" height="63" stroke="#25292E" stroke-width="1" />

  <!-- Battery Spine -->
  <rect x="11" y="11" width="9" height="13" fill="#F0F2F5" />
  <rect x="11" y="26" width="9" height="13" fill="#F0F2F5" />
  <rect x="11" y="41" width="9" height="12" fill="#F0F2F5" />

  <!-- Top Arm (Traction Silver) -->
  <rect x="20" y="11" width="33" height="10" fill="#D0D4D8" />

  <!-- Mitre Drop -->
  <polygon points="45,21 53,21 53,28 45,36" fill="#D0D4D8" />
  <polygon points="45,36 53,28 53,42 45,42" fill="#59A14F" />

  <!-- Middle Arm (Climate Blue) -->
  <rect x="20" y="27" width="22" height="7" fill="#4E79A7" />
  <rect x="20" y="35" width="14" height="3" fill="#E19C24" />

  <!-- Bottom Arm (Regen Green Return Loop) -->
  <path d="M53 42 V53 H23 L20 47.5 L23 42 H45 Z" fill="#59A14F" />
  <polygon points="20,47.5 24,44.5 24,50.5" fill="#0E1012" />
</svg>
