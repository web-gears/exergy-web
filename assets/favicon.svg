<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Exergy - Concept 1: The Grassmann Sankey "E" App Icon -->
  <!-- Background Canvas: Deep Graphite Charcoal -->
  <rect width="512" height="512" fill="#0E1012" />
  
  <!-- Outer Structural Hairline Frame -->
  <rect x="0.5" y="0.5" width="511" height="511" stroke="#25292E" stroke-width="1" />

  <!-- Technical Drafting Reticle Marks (4 Corners) -->
  <path d="M24 36 V24 H36 M476 24 H488 V36 M24 476 V488 H36 M488 476 V488 H476" stroke="#25292E" stroke-width="1.5" />
  
  <!-- Subtle Drafting Grid Hairlines -->
  <line x1="96" y1="24" x2="96" y2="488" stroke="#16191D" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="416" y1="24" x2="416" y2="488" stroke="#16191D" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="24" y1="96" x2="488" y2="96" stroke="#16191D" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="24" y1="416" x2="488" y2="416" stroke="#16191D" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Sub-label in technical monospace: Exergy Second-Law State Mark -->
  <text x="96" y="72" fill="#5A6068" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.15em">STATE: [B // GRASSMANN_FLOW]</text>
  <text x="416" y="72" text-anchor="end" fill="#5A6068" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.1em">E_x 1.0</text>

  <!-- ==================== THE SANKEY "E" GLYPH ==================== -->
  
  <!-- 1. LEFT SPINE: High-Voltage Battery Source Terminal (Split into 3 cells) -->
  <!-- Top Cell (Traction Feed) -->
  <rect x="96" y="96" width="60" height="96" fill="#F0F2F5" />
  <!-- Middle Cell (Aux/HVAC Feed) -->
  <rect x="96" y="196" width="60" height="92" fill="#F0F2F5" />
  <!-- Bottom Cell (Regen Receiver Terminal) -->
  <rect x="96" y="292" width="60" height="124" fill="#F0F2F5" />
  <!-- Battery Cell Divider Seams (2px graphite) -->
  <line x1="96" y1="194" x2="156" y2="194" stroke="#0E1012" stroke-width="4" />
  <line x1="96" y1="290" x2="156" y2="290" stroke="#0E1012" stroke-width="4" />
  <!-- Polarity Indicators on Left Flank -->
  <text x="82" y="150" text-anchor="middle" fill="#8C929A" font-family="'Roboto Mono', monospace" font-size="18" font-weight="700">+</text>
  <text x="82" y="360" text-anchor="middle" fill="#8C929A" font-family="'Roboto Mono', monospace" font-size="20" font-weight="700">−</text>

  <!-- 2. TOP ARM: Traction & Aerodynamic Stream (F_aero + F_roll) -->
  <path d="M156 96 H416 V164 H156 Z" fill="#D0D4D8" />

  <!-- 3. KINETIC RECOVERY LINK: Wheel to Generator Downward Channel -->
  <!-- 45-degree mitre connection between Traction Silver and Regen Green -->
  <polygon points="364,164 416,164 416,216 364,268" fill="#D0D4D8" />
  <polygon points="364,268 416,216 416,348 364,348" fill="#59A14F" />

  <!-- 4. MIDDLE ARMS: Thermal Climate Conditioning & Elevation Work -->
  <!-- Climate HVAC (Steel Blue) -->
  <rect x="156" y="206" width="168" height="38" fill="#4E79A7" />
  <text x="332" y="230" fill="#4E79A7" font-family="'Roboto Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">HVAC</text>

  <!-- Elevation Potential (Ochre Amber) -->
  <rect x="156" y="248" width="124" height="32" fill="#E19C24" />
  <text x="288" y="270" fill="#E19C24" font-family="'Roboto Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">CLIMB</text>

  <!-- 5. BOTTOM ARM: Regenerative Recovery Stream (Looping back into Battery) -->
  <path d="M416 348 V416 H172 L156 382 L172 348 H364 Z" fill="#59A14F" />
  <!-- Terminal Inward Arrowhead (Pointing into Battery Core) -->
  <polygon points="156,382 180,362 180,402" fill="#0E1012" />

  <!-- Sub-label / Telemetry readout at bottom -->
  <text x="96" y="456" fill="#8C929A" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.1em">ΔE_NET = 0</text>
  <text x="416" y="456" text-anchor="end" fill="#59A14F" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.08em">REGEN +18.4%</text>
</svg>
