<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" width="260" height="40" fill="none">
  <!-- Exergy Official Brand Logo: Concept 1 Grassmann Sankey "E" -->
  <!-- Symbol Container (0px radius, 1px hairline border) -->
  <rect x="0.5" y="0.5" width="39" height="39" stroke="#25292E" stroke-width="1" fill="#16191D" />

  <!-- Battery Spine (Modular 3-Cell) -->
  <rect x="7" y="7" width="6" height="7" fill="#F0F2F5" />
  <rect x="7" y="16" width="6" height="7" fill="#F0F2F5" />
  <rect x="7" y="25" width="6" height="8" fill="#F0F2F5" />

  <!-- Traction Top Stream (F_aero + F_roll) -->
  <rect x="13" y="7" width="21" height="6" fill="#D0D4D8" />

  <!-- Kinetic Generator Mitre -->
  <polygon points="29,13 34,13 34,17 29,22" fill="#D0D4D8" />
  <polygon points="29,22 34,17 34,26 29,26" fill="#59A14F" />

  <!-- Middle Streams (Climate & Elevation) -->
  <rect x="13" y="16" width="13" height="4" fill="#4E79A7" />
  <rect x="13" y="21" width="8" height="2" fill="#E19C24" />

  <!-- Regenerative Recovery Loop (Bottom Arm) -->
  <path d="M34 26 V33 H15 L13 29.5 L15 26 H29 Z" fill="#59A14F" />
  <polygon points="13,29.5 16,27.5 16,31.5" fill="#16191D" />

  <!-- Typography: EXERGY -->
  <text x="52" y="27" fill="#F0F2F5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="0.06em">EXERGY</text>
  <line x1="168" y1="12" x2="168" y2="28" stroke="#25292E" stroke-width="1" />
  <text x="178" y="25" fill="#8C929A" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.1em">E<tspan dy="2" font-size="9">X</tspan><tspan dy="-2"> // AAOS</tspan></text>
</svg>
